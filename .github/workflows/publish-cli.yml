name: Publish public CLI
on:
  push:
    tags: ["cli-v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-public-cli
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'gauge-sh/gauge-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - name: Require release metadata and a pinned public runtime
        working-directory: cli
        run: npm run release:validate -- "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm ci --prefix cli
      - run: npm run check
      - name: Qualify exact CLI tarball and anonymously pull its pinned runtime
        run: node scripts/test-runtime-consumer.mjs --pull --pack-destination "$RUNNER_TEMP/cli-release"
      - name: Select OIDC authentication
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
          npm config set registry https://registry.npmjs.org/
      - name: Publish only the qualified public tarball
        run: npm publish "$RUNNER_TEMP/cli-release/"*.tgz --access public --provenance
