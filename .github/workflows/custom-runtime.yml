name: Custom local runtime
on:
  pull_request:
    paths:
      - 'cli/**'
      - 'packages/local/**'
      - 'examples/runtime-python/**'
      - 'scripts/test-custom-runtime.mjs'
      - 'scripts/test-runtime-path.mjs'
      - 'scripts/test-runtime-image.sh'
      - '.github/workflows/custom-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custom-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - run: npm ci && npm ci --prefix cli && npm run build
      - run: docker build -t gauge-runtime:custom-test packages/local/image
      - run: bash scripts/test-runtime-image.sh gauge-runtime:custom-test
      - name: Qualify local CLI session lifecycle
        env:
          GAUGE_DOCKER_FIXTURES: "1"
          GAUGE_TELEMETRY_DISABLED: "1"
          GAUGE_GATEWAY_IMAGE: gauge-gateway:test
        run: |
          docker tag gauge-runtime:custom-test gauge-runtime:dev
          docker build -t gauge-session-fixture:test packages/local/test/runtime-fixture
          docker build -t gauge-gateway:test packages/local/gateway
          cd cli
          npm exec -- tsx --test src/commands/run.lifecycle.test.ts
      - run: docker build --build-arg GAUGE_RUNTIME=gauge-runtime:custom-test -t gauge-runtime-python:custom-test examples/runtime-python
      - run: node scripts/test-runtime-path.mjs gauge-runtime-python:custom-test
      - run: node scripts/test-custom-runtime.mjs
        env:
          GAUGE_CUSTOM_RUNTIME_TEST_IMAGE: gauge-runtime-python:custom-test
