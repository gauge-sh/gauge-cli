name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GAUGE_TELEMETRY_DISABLED: "1"
jobs:
  check:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            runner: ubuntu-24.04
          - node: 24
            runner: ubuntu-24.04
          - node: 24
            runner: macos-15
          - node: 24
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cli
      - run: npm run check
